# Usage:
#   python main.py task=param_search task.pretrained_pre_model=... task.pretrained_post_model=... task.dict_path=... task.val_dir=...

task_type: param_search

# Pretrained model weights
pretrained_pre_model: checkpoints/v1_0-base/final_model/pre_model
pretrained_post_model: checkpoints/v1_0-base/final_model/post_model

# Tokenizer vocab config
vocabs_config: vocabs/config.yaml

# Calibration dictionary
dict_path: dicts/dict_v1.txt

# Validation dataset
val_dir: ${dataset.dataset_dir}/val

# Output directory
output_dir: ./param_search_output

# inference
num_samples: 5000
batchsize: 256
epsilon: 0.0

subtasks:
  preprocess: true      # dict filtering + trie building + model inference -> probs.json
  optuna_search: true   # run Optuna study to find optimal beta

dict:
  max_len: 7

optuna:
  n_trials: 100
  n_best: 5
  objective: "sentence_acc"
  beta_single_low: 0.0001
  beta_single_high: 0.5
  beta_word_low: 0.0001
  beta_word_high: 1.0