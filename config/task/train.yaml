# load model parameters and optimizers to be the initial state if specified.
load_from: null
epochs: 7
batchsize: 4096
optimizer: "adamw"    # "adamw" or "ademamix"
max_learning_rate: 4e-4
min_learning_rate: 4e-5
betas: [0.9, 0.95]
weight_decay: 1e-3
warmup_steps: 7500
decay_steps: 150000
gradient_clip_val: 1.0
compile_model: true
compile_mode: 'default'

# Loss function.
loss_type: "ce" # "ce" or "focal"
# label_smoothing_epsilon: 0.1
# focal_loss_gamma: 1.0
# focal_loss_alpha: 0.5
# Weight of the unconditional loss in the total loss. Set to 0.0 to skip
# computing/logging it entirely (loss = conditional_loss only).
unconditional_loss_lambda: 1.0

# validation
ece_bins: 15
ece_top_k: 5

# Beam search sentence-accuracy metric (top-K sentence accuracy).
beam_width: 3
# Samples decoded per batched beam-search call (tune to fit VRAM).
beam_chunk_size: 64
# Strided sampling rate: decode every stride-th val sample (in dataset order)
# for an even, source-unbiased subset.  Set 1 to decode every sample.
beam_search_stride: 32

# Task type is Train.
task_type: "train"
